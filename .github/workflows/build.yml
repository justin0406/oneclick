name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 需要完整历史：README 同步检查要对比 PR base 与 push 之前的提交
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Install bats-core
        run: sudo npm install -g bats

      - name: Build and validate
        run: ./build.sh --strict

      - name: Lint auxiliary scripts
        run: |
          # tools/*.sh 不进 dist，但同样是用户直接 bash 执行的入口，
          # 一并做语法与静态检查，避免它们成为无人看管的盲区。
          for f in tools/*.sh; do
            echo "-- $f"
            bash -n "$f"
            shellcheck -S warning -e SC1091,SC2034,SC2155 "$f"
          done
          echo "✓ 辅助脚本检查通过"

      # dist/oneclick.sh 是用户直接 curl 下载的产物，必须与 src/ 完全一致。
      # 改了 src 却忘了提交 dist，这一步会失败。
      - name: Check dist is in sync with src
        run: |
          if ! git diff --quiet -- dist/oneclick.sh; then
            echo "::error::dist/oneclick.sh 与 src/ 不一致，请运行 ./build.sh 并提交产物"
            git diff --stat -- dist/oneclick.sh
            exit 1
          fi
          echo "✓ dist 与 src 同步"

      - name: Unit tests
        run: bats tests/

      # 中英文 README 必须一起走：任一份单独改都拒绝。
      # 这个遗漏已经发生过多次（v0.5.0 到 v0.9.0 的功能一个都没同步进中文版），
      # 不能再靠人记，交给 CI。双向检查——只改中文版同样会导致两份文档失配。
      - name: Check README bilingual sync
        run: |
          if [[ "${{ github.event_name }}" = "pull_request" ]]; then
            FILES="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            BASE="${{ github.event.before }}"
            [[ -z "$BASE" || "$BASE" = "0000000000000000000000000000000000000000" ]] && BASE="HEAD^"
            FILES="$(git diff --name-only "$BASE..HEAD")"
          fi
          echo "变更文件："
          echo "$FILES" | sed 's/^/  /'
          has_en=0; has_zh=0
          grep -qx 'README\.md' <<< "$FILES" && has_en=1
          grep -qx 'README\.zh-CN\.md' <<< "$FILES" && has_zh=1
          if (( has_en != has_zh )); then
            if (( has_en )); then
              echo "::error::README.md 有改动但 README.zh-CN.md 没同步——中英文必须一起更新"
            else
              echo "::error::README.zh-CN.md 有改动但 README.md 没同步——中英文必须一起更新"
            fi
            exit 1
          fi
          echo "✓ README 中英文同步检查通过"

      - name: Smoke test
        run: |
          bash dist/oneclick.sh --version
          bash dist/oneclick.sh --help >/dev/null
          # 版本号必须与产物内嵌的一致
          test "$(bash dist/oneclick.sh --version)" = "oneclick $(sed -n 's/^OC_VERSION="\([0-9.]*\)"$/\1/p' src/00-header.sh)"
          echo "✓ 冒烟测试通过"
